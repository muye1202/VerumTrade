name: Pages

# Publishes https://muye1202.github.io/VerumTrade/ :
#   /                 landing page (index.html)
#   /assets/, /demos/ images and the example report
#   /demo/            the web app, built backend-free, replaying recorded runs in the browser
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the static demo app
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "1"
        run: |
          npm ci
          npm run build -- --base /VerumTrade/demo/

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -r assets demos _site/
          cp -r frontend/dist _site/demo
          python demos/replays/export_static_demo.py --out _site/demo/replays
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
